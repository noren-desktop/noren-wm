[package]
name = "noren-wm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
description = "Vertical scrolling tiling window manager for Windows, powered by vscroll-layout"

[[bin]]
name = "noren-wm"
path = "src/main.rs"

[dependencies]
layout = { package = "vscroll-layout", git = "https://github.com/jack-dozen/vscroll-wm.git" }
noren-sdk = { git = "https://github.com/noren-desktop/noren-sdk.git" }
serde_json = "1"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
